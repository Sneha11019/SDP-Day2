<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Layout</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Top Header Section -->
        <header class="profile-header">
            <div class="photo-circle">
                <!-- Replace 'profile.jpg' with your photo filename/URL -->
                <img src="SN_PHOTO.jpg" alt="Your Photo">
            </div>
            <div class="profile-info">
                <h1>SNEHA</h1>
                <p>Aspiring Software Developer.Currently pursuing my Bachelor in Engineering from National Institute Of
                    Engineering Mysore</p>
            </div>
        </header>

        <!-- Content Cards Grid -->
        <main class="cards-grid">

            <!-- First Row: Education Cards -->
            <div class="row education-row">

                <div class="card card-img">
                    <!-- Replace 'school.jpg' with your school image -->
                    <img src="https://tse1.mm.bing.net/th/id/OIP.6QVgT60EXJjHiMcVLLqt9AHaEK?r=0&pid=Api&h=220&P=0"
                        alt="Your School">
                    <span class="card-caption">School:Army Public School SP Marg Lko</span>
                </div>

                <div class="card card-img">
                    <!-- Replace 'pu-college.jpg' with your PU college image -->
                    <img src="https://tse2.mm.bing.net/th/id/OIP.bJ_H23YR0kMu8gxIEGlNhAHaHa?r=0&pid=Api&h=220&P=0" alt="Your PU College">
                    <span class="card-caption">PU College:Army Public School Hisar</span>
                </div>

                <div class="card card-img">
                    <!-- Replace 'engineering-college.jpg' with your engineering college image -->
                    <img src="https://tse4.mm.bing.net/th/id/OIP.z3dfCSZQRINAHcKRO5QouAHaEK?r=0&pid=Api&h=220&P=0" alt="Your Engineering College">
                    <span class="card-caption">Engineering College:National Institute Of Engineering Mysore</span>
                </div>

            </div>

           <!-- Second Row: Achievements (Updated to List Format) -->
      <div class="row achievements-row">

        <div class="card achievement-card">
          <h3>My Achievements</h3>
          <ul class="achievements-list">
            <li></li>
            <li></li>
            <li></li>
          </ul>
        </div>

      </div>

        </main>

    </div>

</body>

</html>
